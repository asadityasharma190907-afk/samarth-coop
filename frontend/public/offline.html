<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samarth — You are Offline</title>
  <style>
    :root {
      --color-brand-primary: #1a6b47;
      --color-brand-primary-light: #2e9e6e;
      --color-surface-bg: #f8faf9;
      --color-surface-card: #ffffff;
      --color-text-primary: #111827;
      --color-text-secondary: #4b5563;
      --color-border-default: #e5e7eb;
      --rounded-xl: 16px;
      --rounded-lg: 12px;
      --shadow-2: 0 4px 16px rgba(26, 107, 71, 0.12);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-surface-bg);
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .offline-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-border-default);
      border-radius: var(--rounded-xl);
      box-shadow: var(--shadow-2);
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .offline-icon-wrapper {
      width: 72px;
      height: 72px;
      background-color: rgba(26, 107, 71, 0.08);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--color-brand-primary);
    }

    .offline-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .offline-subtitle {
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--color-brand-primary);
      margin-bottom: 16px;
    }

    .offline-desc {
      font-size: 0.9375rem;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .retry-button {
      background-color: var(--color-brand-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--rounded-lg);
      padding: 12px 28px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .retry-button:hover {
      background-color: var(--color-brand-primary-light);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon-wrapper">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 class="offline-title">You are currently offline</h1>
    <div class="offline-subtitle">आप वर्तमान में ऑफ़लाइन हैं</div>
    <p class="offline-desc">
      Samarth requires an internet connection to load live worker availability, dispatch jobs, and process bookings. Please check your network connection and try again.
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6"></path>
        <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      Try Reconnecting
    </button>
  </div>
</body>
</html>
