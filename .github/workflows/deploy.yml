name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"

  # Frontend deploys automatically via Render static site or Vercel
  # Set up RENDER_DEPLOY_HOOK_URL in repo Settings > Secrets > Actions
  # Get the hook URL from: Render dashboard > Your service > Settings > Deploy Hook
